<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aviation</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <div class="logo">AVIATION</div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="flights.html">Flights</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="destinations.html">Destinations</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" class="active">Login</a></li>
            </ul>
        </nav>
    </header>


    <!-- Login Section -->
    <section class="login-section">

        <div class="login-container">

            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Login to your Aviation account</p>
            </div>

            <form onsubmit="loginUser(event)">

                <label>Email Address</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <div class="login-options">
                    <label>
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">Login</button>

            </form>

            <div class="register-link">
                <p>Don't have an account?</p>
                <a href="register.html">Create an Account</a>
            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>© 2026 Aviation. All Rights Reserved.</p>
    </footer>


    <!-- JavaScript -->
    
   <script>
async function loginUser(event) {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const button = document.querySelector('form button[type="submit"]');

    if (!window.aviationDB) {
        alert("Supabase connection is missing. Please check js/supabase.js.");
        return;
    }

    button.disabled = true;
    button.textContent = "Logging in...";

    try {
        const { data, error } = await aviationDB.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            throw error;
        }

        alert("Login successful! Welcome to Aviation.");
        window.location.href = "index.html";

    } catch (error) {
        console.error("Login error:", error);
        alert("Login failed: " + error.message);
    } finally {
        button.disabled = false;
        button.textContent = "Login";
    }
}
</script>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

</body>
</html>
